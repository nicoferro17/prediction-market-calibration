name: API Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run Polymarket and Kalshi API smoke test
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/smoke_test_apis.py 2>&1 | tee smoke_test_report.txt

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-smoke-test-report
          path: smoke_test_report.txt
          retention-days: 14
